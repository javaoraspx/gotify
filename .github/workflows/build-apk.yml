name: Build APK with delete confirmation

# 放在你 fork 的仓库里：.github/workflows/build-apk.yml
# 推上去会自动跑一次；编译好的 APK 在本次运行的 Artifacts 里下载。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch (delete confirmation dialog)
        run: python3 .github/patch_add_delete_confirm.py

      - name: Show changes
        run: git --no-pager diff

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不要再用 android-actions/setup-android@v3：
      # 它默认安装 legacy 的 "tools" 包，该包已从 Google SDK 仓库下架，
      # sdkmanager 因此返回 exit code 1。上游 CI 也不装 SDK，直接用 runner 预装的那份。
      - name: Ensure compile SDK 36 (best effort)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -d "$SDK/platforms/android-36" ]; then
            echo "platforms;android-36 already present, nothing to do"
            exit 0
          fi
          CMDLINE_BIN="$(dirname "$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager | head -n 1)")"
          if [ ! -x "$CMDLINE_BIN/sdkmanager" ]; then
            echo "::warning::sdkmanager not found, falling back to AGP auto-download"
            exit 0
          fi
          echo "using $CMDLINE_BIN/sdkmanager"
          yes | "$CMDLINE_BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE_BIN/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" \
            || echo "::warning::sdkmanager install failed, falling back to AGP auto-download"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gotify-delete-confirm
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
